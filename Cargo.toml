[package]
name = "punk_bot"
version = "0.1.0"
edition = "2024"
description = "A Discord music bot without limits"
license = "GPL-3.0"

[dependencies]
env_logger = "0.11.10"
log = "0.4.29"
poise = "0.6.1"
rand = "0.10.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songbird = { version = "0.6.0", features = ["builtin-queue"] }
thiserror = "2"
tokio = { version = "1.51.0", features = ["macros", "signal", "rt-multi-thread", "process", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dependencies.rustls]
version = "0.23.37"
default-features = false
features = ["ring"]

[dependencies.serenity]
default-features = false
features = ["builder", "client", "gateway", "http", "model", "utils", "cache", "voice", "rustls_backend"]
version = "0.12.5"

[profile.release]
lto = true
panic = "abort"
opt-level = 3
codegen-units = 1
